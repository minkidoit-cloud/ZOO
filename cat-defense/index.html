<div id="app">
  <div class="shell" id="shell">

    <!-- ===== HUD ===== -->
    <header class="hud">
      <div class="hud-title">
        <span class="paw">🐾</span>
        <div>
          <h1>애니팡 1000점!</h1>
          <p>1000점 먼저 달성하고 · 클리어 타임에 도전</p>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat gold">
          <span class="stat-label">골드</span>
          <span class="stat-value" id="uiGold">0</span>
        </div>
        <div class="stat wave">
          <span class="stat-label">웨이브</span>
          <span class="stat-value" id="uiWave">1</span>
        </div>
        <div class="stat time">
          <span class="stat-label">시간</span>
          <span class="stat-value" id="uiTime">0.0s</span>
        </div>
      </div>
      <div class="goal">
        <div class="base-hp-top">
          <span>🎯 목표 점수</span>
          <span id="uiGoalText">0 / 1000</span>
        </div>
        <div class="bar"><div class="bar-fill goal-fill" id="uiGoal"></div></div>
      </div>
      <div class="base-hp">
        <div class="base-hp-top">
          <span>🏠 기지 HP</span>
          <span id="uiBaseHpText">120 / 120</span>
        </div>
        <div class="bar"><div class="bar-fill" id="uiBaseHp"></div></div>
      </div>
    </header>

    <!-- ===== FIELD ===== -->
    <div class="field-wrap">
      <canvas id="field"></canvas>
      <div class="banner" id="waveBanner"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <canvas id="heroArt" class="hero-art"></canvas>
          <h2 id="overlayTitle">애니팡 1000점!</h2>
          <p id="overlaySub">프렌즈를 소환해 길냥이 갱단을 처치! <b>1000점 먼저 달성</b>하면 클리어.<br>적은 <b>5초마다 대포</b>로 기지를 포격(웨이브마다 강해짐) — <b>기지 회복</b> 아이템으로 수리하세요!<br>얼마나 빨리 깨는지 <b>타임 어택</b>에 도전!</p>
          <div class="best" id="bestLine">아직 기록 없음</div>
          <button class="start-btn" id="startBtn">전투 시작</button>
        </div>
      </div>
    </div>

    <!-- ===== DOCK ===== -->
    <div class="dock">
      <div class="dock-label">프렌즈 소환</div>
      <div class="btn-row" id="catRow"></div>
      <div class="dock-label">전투 지원 아이템</div>
      <div class="btn-row" id="itemRow"></div>
    </div>
  </div>
</div>

<style>
  :root{
    --bg:#151021; --bg2:#1d1630; --ink:#f4eefb; --muted:#a99fc4;
    --cat:#ff3d7f; --enemy:#e8a33d; --gold:#ffd34e; --danger:#ff4d4d;
    --ally:#5ad1c9; --line:#2c2340; --card:#221a36;
    --tank:#f2a65a; --archer:#f0cd5e; --dps:#8a7bd8; --heal:#f2f2fa;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  #app{
    min-height:100%;
    font-family:"Segoe UI",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a2450 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 110%, #241a3a 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    padding:16px;
  }
  .shell{
    width:100%; max-width:440px;
    background:linear-gradient(180deg,#1a1430,#140f24);
    border:1px solid var(--line);
    border-radius:22px; overflow:hidden;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }

  /* HUD */
  .hud{padding:14px 16px 12px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#221a38,#1a1430);}
  .hud-title{display:flex; align-items:center; gap:10px;}
  .hud-title .paw{font-size:26px; filter:drop-shadow(0 0 8px rgba(255,61,127,.6));}
  .hud-title h1{margin:0; font-size:20px; letter-spacing:.5px; font-weight:800;
    background:linear-gradient(90deg,var(--cat),#ff9ec4);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hud-title p{margin:2px 0 0; font-size:11px; color:var(--muted); letter-spacing:.4px;}

  .hud-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 10px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 10px; display:flex; flex-direction:column; align-items:center;}
  .stat-label{font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;}
  .stat-value{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px;}
  .stat.gold .stat-value{color:var(--gold);}
  .stat.wave .stat-value{color:var(--enemy);}
  .stat.time .stat-value{color:var(--ally); font-size:17px;}

  .goal{margin-bottom:8px;}
  .base-hp-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;
    color:var(--muted); font-variant-numeric:tabular-nums;}
  .base-hp-top span:first-child{color:var(--ink); font-weight:600;}
  .bar{height:12px; background:#0f0b1c; border-radius:8px; overflow:hidden;
    border:1px solid var(--line);}
  .bar-fill{height:100%; width:100%;
    background:linear-gradient(90deg,#57e39b,#2fd07a);
    transition:width .2s ease, background .3s;}
  .goal-fill{background:linear-gradient(90deg,var(--cat),var(--gold));
    box-shadow:0 0 10px rgba(255,211,78,.4);}

  /* FIELD */
  .field-wrap{position:relative; background:#0e0a1a;}
  canvas#field{display:block; width:100%; touch-action:none;}
  .banner{position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(20,14,36,.82); border:1px solid var(--enemy);
    color:var(--enemy); font-weight:800; letter-spacing:1px;
    padding:6px 16px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none;
    box-shadow:0 0 20px rgba(232,163,61,.3);}
  .banner.show{opacity:1;}

  .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(12,8,22,.86); backdrop-filter:blur(3px); z-index:5;
    transition:opacity .35s;}
  .overlay.hide{opacity:0; pointer-events:none;}
  .overlay-card{text-align:center; padding:26px; max-width:320px;}
  .hero-art{display:block; margin:0 auto 4px; max-width:100%;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
  .best{margin:12px auto 4px; display:inline-block;
    background:rgba(255,211,78,.12); border:1px solid rgba(255,211,78,.4);
    color:var(--gold); font-weight:700; font-size:13px;
    padding:5px 14px; border-radius:20px; letter-spacing:.3px;
    font-variant-numeric:tabular-nums;}
  .overlay-card h2{margin:6px 0; font-size:26px; font-weight:800;
    background:linear-gradient(90deg,var(--cat),var(--enemy));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .overlay-card p{margin:8px 0 18px; color:var(--muted); font-size:13px; line-height:1.6;}
  .start-btn{border:0; cursor:pointer; font-weight:800; font-size:15px; letter-spacing:.5px;
    padding:13px 30px; border-radius:14px; color:#1a1430;
    background:linear-gradient(180deg,var(--gold),#f0b429);
    box-shadow:0 8px 20px rgba(255,211,78,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;}
  .start-btn:hover{transform:translateY(-2px);}
  .start-btn:active{transform:translateY(0);}

  /* DOCK */
  .dock{padding:12px 14px 16px; border-top:1px solid var(--line);
    background:linear-gradient(180deg,#181228,#140f22);}
  .dock-label{font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); margin:2px 2px 7px;}
  .btn-row{display:grid; gap:8px; margin-bottom:12px;}
  #catRow{grid-template-columns:repeat(4,1fr);}
  #itemRow{grid-template-columns:repeat(3,1fr); margin-bottom:2px;}

  .gbtn{position:relative; overflow:hidden; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; padding:9px 6px 8px;
    background:var(--card); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:transform .1s, border-color .15s, background .15s;
    -webkit-tap-highlight-color:transparent; user-select:none;}
  .gbtn:hover{border-color:var(--cat);}
  .gbtn:active{transform:scale(.95);}
  .gbtn .g-emoji{font-size:22px; line-height:1;}
  .gbtn .g-icon{width:38px; height:38px; display:block; pointer-events:none;}
  .gbtn .g-name{font-size:11px; font-weight:700;}
  .gbtn .g-cost{font-size:11px; font-weight:800; color:var(--gold);
    font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:2px;}
  .gbtn .g-role{font-size:10px; font-weight:700; color:#ece5ff;
    letter-spacing:.5px; background:rgba(255,255,255,.1);
    padding:1px 7px; border-radius:8px; line-height:1.5;}
  .gbtn.disabled{opacity:.42; cursor:not-allowed;}
  .gbtn .cd{position:absolute; inset:0; border-radius:14px; opacity:0;
    background:rgba(8,5,16,.6); pointer-events:none;
    display:flex; align-items:center; justify-content:center;}
  .gbtn.cooling .cd{opacity:1;}
  .gbtn.cooling{filter:grayscale(.55) brightness(.78);}
  .gbtn .cd-text{font-size:16px; font-weight:800; color:#fff;
    font-variant-numeric:tabular-nums; letter-spacing:.3px;
    text-shadow:0 1px 5px rgba(0,0,0,.85);}
  @keyframes readyGlow{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,61,127,.55), 0 0 7px rgba(255,61,127,.3);
      border-color:var(--cat); }
    50%{ box-shadow:0 0 0 2px var(--cat), 0 0 18px rgba(255,61,127,.75), 0 0 4px rgba(255,158,196,.6);
      border-color:#ff9ec4; }
  }
  .gbtn.ready{ animation:readyGlow 1.25s ease-in-out infinite; border-color:var(--cat); }
  .gbtn.ready:hover{ animation-play-state:paused; }

  /* 전투 지원 아이템: 파란색 계열 테두리 */
  #itemRow .gbtn{ border-color:rgba(74,168,255,.4); }
  #itemRow .gbtn:hover{ border-color:#4aa8ff; }
  #itemRow .gbtn.ready{ animation:readyGlowBlue 1.25s ease-in-out infinite; border-color:#4aa8ff; }
  @keyframes readyGlowBlue{
    0%,100%{ box-shadow:0 0 0 1px rgba(74,168,255,.55), 0 0 7px rgba(74,168,255,.3);
      border-color:#3f9bff; }
    50%{ box-shadow:0 0 0 2px #4aa8ff, 0 0 18px rgba(74,168,255,.75), 0 0 4px rgba(150,200,255,.6);
      border-color:#8cc6ff; }
  }
  .gbtn .cd-bar{position:absolute; left:0; bottom:0; width:100%; height:5px;
    transform-origin:left; transform:scaleX(0); border-radius:0 0 12px 12px;
    background:linear-gradient(90deg,var(--cat),var(--gold));
    box-shadow:0 0 8px rgba(255,211,78,.6);}
  .gbtn.armed{box-shadow:0 0 0 2px var(--cat), 0 0 18px rgba(255,61,127,.5);}

  @media (max-width:420px){
    #app{padding:0;}
    .shell{border-radius:0; max-width:none; min-height:100vh;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
    .gbtn.ready{ animation:none !important;
      box-shadow:0 0 0 2px var(--cat), 0 0 12px rgba(255,61,127,.6); border-color:var(--cat); }
    #itemRow .gbtn.ready{ box-shadow:0 0 0 2px #4aa8ff, 0 0 12px rgba(74,168,255,.6); border-color:#4aa8ff; }
  }
</style>

<script>
(function(){
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('field');
  let ctx = canvas.getContext('2d');  // retargetable so button icons reuse the same draw fns
  let W = 0, H = 0, DPR = 1;
  const FIELD_ASPECT = 1.28; // height / width

  function resize(){
    const wrap = canvas.parentElement;
    const cssW = wrap.clientWidth;
    const cssH = Math.round(cssW * FIELD_ASPECT);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssH * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W = cssW; H = cssH;
  }
  window.addEventListener('resize', resize);

  // ---------- Config ----------
  const BASE_Y_RATIO = 0.9;         // base line position
  const SPAWN_Y_RATIO = 0.08;       // enemy spawn line
  const LANE_PAD = 34;

  const CAT_TYPES = {
    tank:   {name:'블루', role:'전사',  emoji:'🐶', color:'#6ec6e8', cost:25, cd:1.2,
             hp:240, atk:14, atkInt:1.0, range:34, speed:18, kind:'melee'},
    archer: {name:'루시', role:'궁수',  emoji:'🐱', color:'#b9b9c0', cost:40, cd:2.0,
             hp:40,  atk:16, atkInt:0.5, range:150, speed:30, kind:'ranged'},
    dps:    {name:'몽이', role:'딜러',  emoji:'🐵', color:'#8a5a3b', cost:35, cd:1.6,
             hp:70,  atk:44, atkInt:0.7, range:36, speed:60, kind:'melee'},
    heal:   {name:'애니', role:'힐러',  emoji:'🐰', color:'#f7e3ea', cost:55, cd:4.0,
             hp:95,  atk:0,  atkInt:1.0, range:65,  speed:26, kind:'heal', healAmt:8},
  };

  const ENEMY_TYPES = {
    warrior:{name:'전사', color:'#4a86c8', hp:150, atk:12, atkInt:1.0, range:34, speed:20, gold:16, score:12, kind:'melee'},
    archer: {name:'궁수', color:'#9a9aa2', hp:70,  atk:13, atkInt:1.2, range:140,speed:18, gold:20, score:16, kind:'ranged'},
    dps:    {name:'딜러', color:'#c8923e', hp:85,  atk:18, atkInt:0.8, range:32, speed:42, gold:20, score:16, kind:'melee'},
    healer: {name:'힐러', color:'#e8e8ee', hp:80,  atk:0,  atkInt:1.4, range:120,speed:22, gold:24, score:20, kind:'heal', healAmt:14},
  };

  const ITEMS = {
    churu:{name:'전체 회복', emoji:'🍡', cost:50, cd:6},
    can:  {name:'적 유인', emoji:'🥫', cost:60, cd:9},
    rod:  {name:'기지 회복', emoji:'🔧', cost:80, cd:5},
  };

  // ---------- Game state ----------
  let state, units, effects, floaters;
  let running = false, lastT = 0, animId = null;

  function newState(){
    return {
      gold:150, score:0, wave:0, baseHp:120, baseMax:120,
      goal:1000, time:0, won:false,
      atkMul:1.0,                 // rod buff
      goldTimer:0, siegeTimer:5,   // 대포: 5초마다 기지 포격

      spawnQueue:[], spawnTimer:0, waveActive:false, waveBreak:2.0, enemiesLeft:0,
      over:false,
    };
  }

  function reset(){
    state = newState();
    units = [];
    effects = [];   // {type:'can', x,y,t}
    floaters = [];  // {x,y,text,color,t,vy}
    cds = {};       // cooldown timers per button id
  }

  // ---------- Helpers ----------
  function baseY(){ return H * BASE_Y_RATIO; }
  function spawnY(){ return H * SPAWN_Y_RATIO; }
  function laneX(){ return LANE_PAD + Math.random()*(W - LANE_PAD*2); }
  function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  const SUMMON_COUNT = 2;               // 소환 1회당 나오는 마리 수
  const CAT_POWER = 1 / SUMMON_COUNT;   // 개체 스탯 = 원래/마리수 → 총 전력은 동일

  function makeUnit(team, key){
    const t = team==='cat' ? CAT_TYPES[key] : ENEMY_TYPES[key];
    const u = {
      team, key, ...t,
      maxHp:t.hp, hp:t.hp,
      x: laneX(),
      y: team==='cat' ? baseY()-6 : spawnY(),
      cd:0, retreat:0, hit:0,
      r: (team==='cat' ? (key==='tank'?18:15) : (key==='dps'?13:16)) * 0.85,
    };
    if(team==='cat'){
      // 2마리씩 소환되므로 개체 체력·공격력을 나눠 총합 밸런스를 유지
      u.maxHp = Math.max(1, Math.round(t.hp*CAT_POWER)); u.hp=u.maxHp;
      u.atk = Math.round(t.atk*CAT_POWER);
      if(t.healAmt) u.healAmt = Math.max(1, Math.round(t.healAmt*CAT_POWER));
    }
    return u;
  }

  // ---------- Spawning cats ----------
  function trySpawnCat(key){
    const t = CAT_TYPES[key];
    if(state.over) return;
    if(cds['cat_'+key] > 0) return;
    if(state.gold < t.cost) { flashDock(); return; }
    state.gold -= t.cost;
    cds['cat_'+key] = t.cd;
    // one summon fields multiple friends
    for(let i=0;i<SUMMON_COUNT;i++){ units.push(makeUnit('cat', key)); }
    addFloater(W/2, baseY()-22, t.name+' x'+SUMMON_COUNT+'!', t.color, -30);
  }

  // ---------- Items ----------
  function useItem(key){
    if(state.over) return;
    const it = ITEMS[key];
    if(cds['item_'+key] > 0) return;
    if(state.gold < it.cost){ flashDock(); return; }
    state.gold -= it.cost;
    cds['item_'+key] = it.cd;

    if(key==='churu'){
      let healed=false;
      for(const u of units){ if(u.team==='cat'){
        const before=u.hp; u.hp=Math.min(u.maxHp, u.hp+u.maxHp*0.2);
        if(u.hp>before){ healed=true; addFloater(u.x,u.y-16,'+'+Math.round(u.hp-before),'#57e39b',-24);} }}
      pulse('#57e39b');
    } else if(key==='rod'){
      const before=state.baseHp;
      state.baseHp=Math.min(state.baseMax, state.baseHp + Math.round(state.baseMax*0.4));
      addFloater(W/2, baseY()-30, '기지 +'+Math.round(state.baseHp-before), '#57e39b', -30);
      pulse('#57e39b');
    } else if(key==='can'){
      // throw a can into enemy territory -> enemies retreat toward top
      const cx = W/2 + (Math.random()*80-40);
      const cy = H*0.28;
      effects.push({type:'can', x:cx, y:cy, t:0, life:4.0});
      for(const u of units){ if(u.team==='enemy'){ u.retreat = 4.0; } }
      pulse('#ffd34e');
    }
  }

  // ---------- Waves ----------
  function startWave(){
    state.wave++;
    const n = state.wave;
    const giant = (n % 5 === 0);
    state.giant = giant;
    let count = Math.round((10 + n*2) * 1.3);  // 떼거리 +30%: 1웨이브 ~16마리
    if(giant) count = Math.round(count*2.2);
    const q = [];
    for(let i=0;i<count;i++){
      let key='warrior';
      const roll=Math.random();
      if(n>=2 && roll<0.30) key='dps';
      else if(n>=3 && roll<0.50) key='archer';
      else if(n>=4 && roll<0.60) key='healer';
      q.push(key);
    }
    state.spawnQueue = q;
    state.enemiesLeft = q.length;
    state.spawnTimer = 0.3;
    state.spawnBatch = giant ? 4 : 2;  // 한 번에 여러 마리 동시 등장
    state.waveActive = true;
    banner((giant?'⚠ 거대 웨이브 '+n:'WAVE '+n)+' · 적 '+q.length+'마리');
  }

  function updateWaves(dt){
    if(!state.waveActive){
      state.waveBreak -= dt;
      // 다음 웨이브가 거대 웨이브면 미리 경고
      if(!state._warned && state.waveBreak<1.3 && ((state.wave+1)%5===0)){
        state._warned=true; banner('⚠ 거대 웨이브 접근! 병력을 준비하세요');
      }
      if(state.waveBreak<=0){ state._warned=false; startWave(); }
      return;
    }
    if(state.spawnQueue.length>0){
      state.spawnTimer -= dt;
      if(state.spawnTimer<=0){
        const s = 1 + 0.05*(state.wave-1);
        for(let b=0; b<state.spawnBatch && state.spawnQueue.length>0; b++){
          const key = state.spawnQueue.shift();
          const e = makeUnit('enemy', key);
          e.maxHp = Math.round(e.maxHp*s); e.hp=e.maxHp;
          e.atk = Math.round(e.atk*(1+0.035*(state.wave-1)));
          units.push(e);
        }
        state.spawnTimer = Math.max(0.22, 0.5 - state.wave*0.015);
      }
    } else if(state.enemiesLeft<=0){
      state.waveActive = false;
      state.waveBreak = 2.2;
      banner('웨이브 클리어! 잠시 정비…');
    }
  }

  // ---------- Combat / movement ----------
  function nearestEnemyOf(u, list){
    let best=null, bd=Infinity;
    for(const o of list){
      if(o.dead) continue;
      if(o.team===u.team) continue;
      const d = dist(u,o);
      if(d<bd){ bd=d; best=o; }
    }
    return {t:best, d:bd};
  }
  function lowestAllyInRange(u){
    let best=null, bv=1;
    for(const o of units){
      if(o.dead || o.team!==u.team || o===u) continue;
      if(dist(u,o) > u.range) continue;
      const frac=o.hp/o.maxHp;
      if(frac<bv && frac<1){ bv=frac; best=o; }
    }
    return best;
  }

  function updateUnits(dt){
    for(const u of units){
      if(u.dead) continue;
      u.cd = Math.max(0, u.cd-dt);
      if(u.hit>0) u.hit-=dt;
      if(u.animT>0) u.animT-=dt;
      if(u.retreat>0) u.retreat-=dt;

      // ---- HEALER: 힐 오라(범위) 안의 아군을 지속 회복 ----
      if(u.kind==='heal'){
        if(u.cd<=0){
          let healed=false;
          for(const o of units){
            if(o.dead || o.team!==u.team || o===u) continue;
            if(o.hp>=o.maxHp) continue;
            if(dist(u,o) > u.range) continue;
            o.hp=Math.min(o.maxHp, o.hp+u.healAmt);
            healed=true;
          }
          u.cd = u.atkInt;
          if(healed) addFloater(u.x, u.y-u.r-8, '힐 +'+u.healAmt, '#57e39b', -16);
        }
        if(u.team==='cat'){
          const front = frontCatY();
          if(u.y > front+70) u.y -= u.speed*dt;      // 아군 힐러: 전선 뒤 따라감
        } else {
          if(u.y < baseY()-u.r-50) u.y += u.speed*dt; // 적 힐러: 뒤따라 내려옴
        }
        keepX(u);
        continue;
      }

      // ---- ENEMY retreat (can lure) ----
      if(u.team==='enemy' && u.retreat>0){
        u.y -= u.speed*1.1*dt;
        u.y = Math.max(spawnY()-10, u.y);
        keepX(u);
        continue;
      }

      const {t:tgt, d} = nearestEnemyOf(u, units);

      if(u.team==='cat'){
        if(tgt){
          if(d <= u.range){
            // in range -> attack (ranged holds distance, melee closes in)
            if(u.cd<=0){ attack(u, tgt); u.cd=u.atkInt; }
          } else {
            // charge toward the nearest enemy (x and y)
            moveToward(u, tgt.x, tgt.y, dt);
          }
        } else {
          // no enemies -> hold near the front line
          moveToward(u, u.x, spawnY()+H*0.28, dt);
        }
      } else {
        // enemy
        if(tgt && d <= u.range){
          if(u.cd<=0){ attack(u, tgt); u.cd=u.atkInt; }
        } else if(tgt && d < u.range + 70){
          // a cat is blocking the way -> engage it
          moveToward(u, tgt.x, tgt.y, dt);
        } else if(u.y < baseY()-u.r){
          // push down toward the base
          moveToward(u, u.x, baseY(), dt);
        } else {
          // attack base
          if(u.cd<=0){
            state.baseHp = Math.max(0, state.baseHp - u.atk);
            u.cd=u.atkInt; u.hit=0.12;
            addFloater(u.x, baseY()-8, '-'+u.atk, '#ff4d4d', -18);
            if(state.baseHp<=0) gameOver();
          }
        }
      }
      keepX(u);
    }

    // cull dead
    for(let i=units.length-1;i>=0;i--){
      const u=units[i];
      if(u.dead){
        if(u.team==='enemy'){
          state.gold += u.gold; state.score += u.score;
          state.enemiesLeft = Math.max(0, state.enemiesLeft-1);
          addFloater(u.x, u.y, '+'+u.gold+'G', '#ffd34e', -26);
        }
        units.splice(i,1);
      }
    }
  }

  function attack(u, tgt){
    const dmg = Math.round(u.atk * (u.team==='cat'? state.atkMul : 1));
    tgt.hp -= dmg; tgt.hit=0.12; u.hit=0.10;
    if(u.kind==='melee'){
      u.animAng = Math.atan2(tgt.y-u.y, tgt.x-u.x);
      u.animDur = (u.key==='dps') ? 0.28 : 0.26;
      u.animT = u.animDur;
    }
    if(u.kind==='ranged') effects.push({type:'shot', x:u.x, y:u.y, tx:tgt.x, ty:tgt.y, t:0, life:0.18, team:u.team});
    if(tgt.hp<=0){ tgt.dead=true; }
  }

  function frontCatY(){
    let y=baseY();
    for(const u of units){ if(u.team==='cat' && u.kind!=='heal' && u.y<y) y=u.y; }
    return y;
  }
  function keepX(u){ u.x = clamp(u.x, LANE_PAD, W-LANE_PAD); }
  // push overlapping units apart so they don't stack into one blob
  function separateUnits(){
    for(let i=0;i<units.length;i++){
      const a=units[i]; if(a.dead) continue;
      for(let j=i+1;j<units.length;j++){
        const b=units[j]; if(b.dead) continue;
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        const min=(a.r+b.r)*0.95;
        if(d===0){ dx=Math.random()-0.5; dy=Math.random()-0.5; d=Math.hypot(dx,dy)||1; }
        if(d<min){
          const push=(min-d)*0.5, nx=dx/d, ny=dy/d;
          a.x-=nx*push; a.y-=ny*push;
          b.x+=nx*push; b.y+=ny*push;
        }
      }
    }
    for(const u of units){ keepX(u); u.y=clamp(u.y, spawnY()-6, baseY()); }
  }
  function moveToward(u, tx, ty, dt){
    const dx=tx-u.x, dy=ty-u.y, d=Math.hypot(dx,dy);
    if(d<0.001) return;
    const step = u.speed*dt;
    u.x += dx/d*step;
    u.y += dy/d*step;
    u.y = clamp(u.y, spawnY()-6, baseY());
  }

  // ---------- Floaters & effects ----------
  function addFloater(x,y,text,color,vy){ floaters.push({x,y,text,color,t:0,life:0.9,vy:vy||-24}); }
  function updateFX(dt){
    for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; f.y+=f.vy*dt;
      if(f.t>=f.life) floaters.splice(i,1); }
    for(let i=effects.length-1;i>=0;i--){ const e=effects[i]; e.t+=dt;
      if(e.t>=e.life){
        if(e.type==='cannon') cannonImpact(e);   // 포탄 착탄 → 기지 피해
        effects.splice(i,1);
      }
    }
  }

  // ---------- Enemy cannon (base siege) ----------
  function fireCannon(){
    if(state.over) return;
    // 후방(제일 위쪽) 적에서, 없으면 화면 밖 포병대에서 발사
    const enemies = units.filter(u=>u.team==='enemy'&&!u.dead);
    const src = enemies.length ? enemies.reduce((a,b)=>b.y<a.y?b:a) : null;
    const sx = src ? src.x : LANE_PAD + Math.random()*(W-LANE_PAD*2);
    const sy = src ? src.y : spawnY()-14;
    const tx = W*0.28 + Math.random()*W*0.44;
    const ty = baseY() + (H-baseY())*0.35;
    const dmg = 7 + Math.max(0, state.wave-1)*3;   // 7부터 웨이브마다 +3
    effects.push({type:'cannon', x:sx, y:sy, tx, ty, t:0, life:0.85, dmg});
  }
  function cannonImpact(e){
    if(state.over) return;
    state.baseHp = Math.max(0, state.baseHp - e.dmg);
    effects.push({type:'boom', x:e.tx, y:e.ty, t:0, life:0.4});
    addFloater(e.tx, e.ty-8, '-'+e.dmg, '#ff4d4d', -20);
    pulse('#ff4d4d');
    if(state.baseHp<=0) gameOver();
  }

  // ---------- Rendering ----------
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawField();
    drawAuras();
    // draw units back-to-front by y
    const sorted = units.slice().sort((a,b)=>a.y-b.y);
    for(const u of sorted) drawUnit(u);
    drawEffects();
    drawBase();
    drawFloaters();
  }

  // 힐러의 회복 범위 오라
  function drawAuras(){
    const t = performance.now()/1000;
    for(const u of units){
      if(u.dead || u.kind!=='heal') continue;
      const ally = u.team==='cat';
      const pulse = 0.5 + 0.5*Math.sin(t*2.5);
      ctx.save();
      ctx.beginPath(); ctx.arc(u.x, u.y, u.range, 0, Math.PI*2);
      ctx.fillStyle = ally ? 'rgba(87,227,155,0.08)' : 'rgba(255,120,120,0.07)';
      ctx.fill();
      ctx.strokeStyle = ally
        ? 'rgba(87,227,155,'+(0.25+0.2*pulse)+')'
        : 'rgba(255,120,120,'+(0.22+0.18*pulse)+')';
      ctx.lineWidth=1.5; ctx.setLineDash([6,6]);
      ctx.stroke(); ctx.setLineDash([]);
      // 레이더 스윕: 도는 선 + 잔상 섹터
      const ang = (t*1.8) % (Math.PI*2);
      ctx.translate(u.x, u.y);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,u.range, ang-0.6, ang); ctx.closePath();
      ctx.fillStyle = ally ? 'rgba(87,227,155,0.16)' : 'rgba(255,120,120,0.14)';
      ctx.fill();
      ctx.strokeStyle = ally ? 'rgba(120,255,190,0.8)' : 'rgba(255,150,150,0.8)';
      ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(ang)*u.range, Math.sin(ang)*u.range); ctx.stroke();
      ctx.restore();
    }
  }

  function drawField(){
    // ground gradient
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#241338'); g.addColorStop(0.5,'#170f28'); g.addColorStop(1,'#120c20');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // perspective lane lines
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
    for(let i=1;i<6;i++){ const x=W*i/6; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    // enemy spawn zone glow
    const sg=ctx.createLinearGradient(0,0,0,spawnY()+30);
    sg.addColorStop(0,'rgba(232,163,61,0.12)'); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,spawnY()+30);
    // dashed midline
    ctx.setLineDash([6,8]); ctx.strokeStyle='rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.moveTo(0,H*0.5); ctx.lineTo(W,H*0.5); ctx.stroke(); ctx.setLineDash([]);
  }

  function drawBase(){
    const by=baseY();
    // base platform glow
    const bg=ctx.createLinearGradient(0,by,0,H);
    bg.addColorStop(0,'rgba(255,61,127,0.18)'); bg.addColorStop(1,'rgba(255,61,127,0.02)');
    ctx.fillStyle=bg; ctx.fillRect(0,by,W,H-by);
    ctx.strokeStyle='rgba(255,61,127,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,by); ctx.lineTo(W,by); ctx.stroke();
    // house
    ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏠', W*0.5, by+ (H-by)/2);
    ctx.fillText('🐾', W*0.22, by+(H-by)/2);
    ctx.fillText('🧶', W*0.78, by+(H-by)/2);
  }

  // --- shared face parts (drawn in local space, head centered at 0,0) ---
  function eyes(r, dy, sp, sz){
    ctx.fillStyle='#2a2233';
    ctx.beginPath();
    ctx.ellipse(-sp,dy,sz,sz*1.15,0,0,Math.PI*2);
    ctx.ellipse(sp,dy,sz,sz*1.15,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-sp+sz*0.3,dy-sz*0.45,sz*0.3,0,Math.PI*2);
    ctx.arc(sp+sz*0.3,dy-sz*0.45,sz*0.3,0,Math.PI*2); ctx.fill();
  }
  function blush(r, dy, sp, col){
    ctx.fillStyle=col||'rgba(255,140,155,0.5)';
    ctx.beginPath();
    ctx.ellipse(-sp,dy,r*0.22,r*0.14,0,0,Math.PI*2);
    ctx.ellipse(sp,dy,r*0.22,r*0.14,0,0,Math.PI*2); ctx.fill();
  }

  function drawGrayCat(r){
    const body='#b9b9c0', dark='#8f8f98', line='rgba(90,90,100,0.45)';
    ctx.strokeStyle=line; ctx.lineWidth=1.5; ctx.fillStyle=body;
    // cat ears (triangles)
    ctx.beginPath();
    ctx.moveTo(-r*0.75,-r*0.5); ctx.lineTo(-r*0.95,-r*1.2); ctx.lineTo(-r*0.28,-r*0.78); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r*0.75,-r*0.5); ctx.lineTo(r*0.95,-r*1.2); ctx.lineTo(r*0.28,-r*0.78); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // inner ears (pink)
    ctx.fillStyle='#e8b7c2';
    ctx.beginPath(); ctx.moveTo(-r*0.68,-r*0.56); ctx.lineTo(-r*0.84,-r*1.02); ctx.lineTo(-r*0.42,-r*0.74); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r*0.68,-r*0.56); ctx.lineTo(r*0.84,-r*1.02); ctx.lineTo(r*0.42,-r*0.74); ctx.closePath(); ctx.fill();
    // head
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // tabby stripes on forehead
    ctx.strokeStyle=dark; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath();
    ctx.moveTo(0,-r*0.92); ctx.lineTo(0,-r*0.5);
    ctx.moveTo(-r*0.24,-r*0.85); ctx.lineTo(-r*0.19,-r*0.55);
    ctx.moveTo(r*0.24,-r*0.85); ctx.lineTo(r*0.19,-r*0.55); ctx.stroke(); ctx.lineCap='butt';
    // muzzle
    ctx.fillStyle='#e8e5ea'; ctx.beginPath(); ctx.ellipse(0,r*0.34,r*0.5,r*0.32,0,0,Math.PI*2); ctx.fill();
    eyes(r, -r*0.02, r*0.4, r*0.16);
    blush(r, r*0.3, r*0.62, 'rgba(200,150,160,0.4)');
    // nose (pink triangle)
    ctx.fillStyle='#e79aa8'; ctx.beginPath();
    ctx.moveTo(0,r*0.28); ctx.lineTo(-r*0.08,r*0.2); ctx.lineTo(r*0.08,r*0.2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#8f8f98'; ctx.lineWidth=1.3; ctx.beginPath();
    ctx.moveTo(0,r*0.28); ctx.lineTo(0,r*0.36); ctx.stroke();
    // whiskers
    ctx.strokeStyle='rgba(120,120,130,0.5)'; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(-r*0.42,r*0.3); ctx.lineTo(-r*0.98,r*0.22);
    ctx.moveTo(-r*0.42,r*0.4); ctx.lineTo(-r*0.94,r*0.44);
    ctx.moveTo(r*0.42,r*0.3); ctx.lineTo(r*0.98,r*0.22);
    ctx.moveTo(r*0.42,r*0.4); ctx.lineTo(r*0.94,r*0.44); ctx.stroke();
  }
  function drawMonkey(r){
    const fur='#8a5a3b', face='#f0d6b0', line='rgba(70,40,20,0.45)';
    ctx.strokeStyle=line; ctx.lineWidth=1.5; ctx.fillStyle=fur;
    ctx.beginPath(); ctx.arc(-r*0.95,-r*0.02,r*0.34,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.95,-r*0.02,r*0.34,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=face; ctx.beginPath();
    ctx.arc(-r*0.95,-r*0.02,r*0.17,0,Math.PI*2); ctx.arc(r*0.95,-r*0.02,r*0.17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=fur; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=face; ctx.beginPath(); ctx.ellipse(0,r*0.12,r*0.72,r*0.66,0,0,Math.PI*2); ctx.fill();
    eyes(r, -r*0.05, r*0.34, r*0.15);
    blush(r, r*0.24, r*0.5, 'rgba(230,140,120,0.45)');
    ctx.fillStyle='#b98a63'; ctx.beginPath();
    ctx.arc(-r*0.08,r*0.24,r*0.05,0,Math.PI*2); ctx.arc(r*0.08,r*0.24,r*0.05,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#a9714a'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.arc(0,r*0.28,r*0.18,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  function drawDog(r){
    const body='#6ec6e8', ear='#2f8fc0', cheek='#f4c542', line='rgba(30,90,130,0.45)';
    ctx.strokeStyle=line; ctx.lineWidth=1.5; ctx.fillStyle=ear;
    ctx.beginPath(); ctx.ellipse(-r*0.82,-r*0.45,r*0.3,r*0.5,0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r*0.82,-r*0.45,r*0.3,r*0.5,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=cheek; ctx.beginPath();
    ctx.arc(-r*0.62,r*0.36,r*0.2,0,Math.PI*2); ctx.arc(r*0.62,r*0.36,r*0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#cdeaf6'; ctx.beginPath(); ctx.ellipse(0,r*0.32,r*0.4,r*0.3,0,0,Math.PI*2); ctx.fill();
    eyes(r, -r*0.05, r*0.36, r*0.16);
    ctx.fillStyle='#1f3a4a'; ctx.beginPath(); ctx.arc(0,r*0.2,r*0.11,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1f3a4a'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(0,r*0.31); ctx.lineTo(0,r*0.4); ctx.stroke();
  }
  function drawBunny(r){
    const body='#f7e3ea', cap='#6b4a37', capD='#4f3628', lens='#8fd0e6', line='rgba(150,110,120,0.45)';
    ctx.strokeStyle=line; ctx.lineWidth=1.5; ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(-r*0.4,-r*1.12,r*0.2,r*0.58,0.12,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r*0.4,-r*1.12,r*0.2,r*0.58,-0.12,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f3c9d4';
    ctx.beginPath(); ctx.ellipse(-r*0.4,-r*1.08,r*0.09,r*0.38,0.12,0,Math.PI*2);
    ctx.ellipse(r*0.4,-r*1.08,r*0.09,r*0.38,-0.12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // aviator cap band across the top
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=cap; ctx.fillRect(-r,-r,r*2,r*0.62);
    ctx.restore();
    // goggles pushed up on the forehead
    ctx.fillStyle=capD; ctx.beginPath();
    ctx.arc(-r*0.4,-r*0.22,r*0.27,0,Math.PI*2); ctx.arc(r*0.4,-r*0.22,r*0.27,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=lens; ctx.beginPath();
    ctx.arc(-r*0.4,-r*0.22,r*0.17,0,Math.PI*2); ctx.arc(r*0.4,-r*0.22,r*0.17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath();
    ctx.arc(-r*0.46,-r*0.28,r*0.06,0,Math.PI*2); ctx.arc(r*0.34,-r*0.28,r*0.06,0,Math.PI*2); ctx.fill();
    eyes(r, r*0.24, r*0.34, r*0.14);
    blush(r, r*0.36, r*0.55);
    ctx.fillStyle='#e79aa8'; ctx.beginPath(); ctx.arc(0,r*0.44,r*0.07,0,Math.PI*2); ctx.fill();
  }
  const CAT_DRAW = {tank:drawDog, archer:drawGrayCat, dps:drawMonkey, heal:drawBunny};

  function drawEnemyCat(u){
    const r=u.r, hit=u.hit>0;
    ctx.fillStyle = hit ? '#ffffff' : u.color;
    ctx.strokeStyle='rgba(232,163,61,0.9)'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-r*0.7,-r*0.4); ctx.lineTo(-r*0.95,-r*1.15); ctx.lineTo(-r*0.2,-r*0.75);
    ctx.moveTo(r*0.7,-r*0.4); ctx.lineTo(r*0.95,-r*1.15); ctx.lineTo(r*0.2,-r*0.75);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // eyes: light sclera + dark pupil so they read on any body color
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-r*0.38,r*0.05,r*0.15,0,Math.PI*2); ctx.arc(r*0.38,r*0.05,r*0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a2233';
    ctx.beginPath(); ctx.arc(-r*0.36,r*0.06,r*0.08,0,Math.PI*2); ctx.arc(r*0.36,r*0.06,r*0.08,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(-r*0.6,-r*0.35); ctx.lineTo(-r*0.18,-r*0.08);
    ctx.moveTo(r*0.6,-r*0.35); ctx.lineTo(r*0.18,-r*0.08); ctx.stroke();
    ctx.strokeStyle='rgba(255,80,80,0.85)'; ctx.beginPath();
    ctx.moveTo(r*0.5,-r*0.8); ctx.lineTo(r*0.2,-r*0.1); ctx.stroke();
  }

  // 근접 공격 모션 (호출 시 이미 unit 중심으로 translate 된 상태)
  function drawMeleeFX(u){
    const p = 1 - u.animT/u.animDur;   // 0 → 1
    ctx.save();
    ctx.rotate(u.animAng);             // 로컬 +x 축이 적을 향함
    if(u.key==='tank'){
      // 칼 휘두르기: 앞쪽에서 호를 그리며 스윙
      const R = u.r*1.5;
      const a = -1.0 + p*2.0;          // 스윙 각도
      ctx.globalAlpha = 1 - p*0.5;
      ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(0,0,R, a-0.55, a+0.55); ctx.stroke();
      ctx.strokeStyle='rgba(150,220,255,0.7)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,R+3, a-0.4, a+0.4); ctx.stroke();
      ctx.globalAlpha=1;
    } else {
      // 창 찌르기: 앞으로 쭉 나갔다 들어옴
      const ext = Math.sin(p*Math.PI);          // 0 → 1 → 0
      const tip = u.r*0.5 + ext*u.r*1.9;
      const base = u.r*0.3;
      ctx.strokeStyle='#c9c9d4'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(base,0); ctx.lineTo(tip,0); ctx.stroke();
      ctx.fillStyle='#ffd34e';                   // 창날
      ctx.beginPath(); ctx.moveTo(tip+4,0); ctx.lineTo(tip-5,-4); ctx.lineTo(tip-5,4); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawUnit(u){
    ctx.save();
    ctx.translate(u.x,u.y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath();
    ctx.ellipse(0,u.r*0.95,u.r*0.9,u.r*0.35,0,0,Math.PI*2); ctx.fill();

    if(u.team==='cat'){
      (CAT_DRAW[u.key]||drawDog)(u.r);
      if(u.hit>0){ ctx.globalAlpha=0.4; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(0,0,u.r*1.05,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      if(u.animT>0 && (u.key==='tank'||u.key==='dps')) drawMeleeFX(u);
    } else {
      drawEnemyCat(u);
    }
    ctx.restore();

    // HP bar
    const bw=u.r*2.0, bh=4;
    const bx=u.x-bw/2, byy=u.y-u.r-12;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx-1,byy-1,bw+2,bh+2);
    ctx.fillStyle = u.team==='cat' ? '#57e39b' : '#ff6a6a';
    ctx.fillRect(bx,byy,bw*clamp(u.hp/u.maxHp,0,1),bh);

    if(u.retreat>0){ // lured marker
      ctx.font='12px serif'; ctx.textAlign='center';
      ctx.fillText('❓', u.x, u.y-u.r-18);
    }
  }

  function drawEffects(){
    for(const e of effects){
      if(e.type==='shot'){
        const p=e.t/e.life;
        const x=e.x+(e.tx-e.x)*p, y=e.y+(e.ty-e.y)*p;
        ctx.fillStyle = e.team==='cat' ? '#ff9ec4' : '#ffe08a';
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      } else if(e.type==='can'){
        const p=e.t/e.life;
        ctx.globalAlpha = 1-p;
        ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🥫', e.x, e.y - Math.sin(p*Math.PI)*10);
        ctx.strokeStyle='rgba(255,211,78,'+(0.6*(1-p))+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(e.x,e.y,20+p*40,0,Math.PI*2); ctx.stroke();
        ctx.globalAlpha=1;
      } else if(e.type==='cannon'){
        const p=e.t/e.life;
        const x=e.x+(e.tx-e.x)*p;
        const y=e.y+(e.ty-e.y)*p - Math.sin(p*Math.PI)*90;  // 포물선 궤적
        ctx.fillStyle='rgba(255,138,61,0.22)';               // 화염 글로우
        ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(255,138,61,0.4)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(x,y+11); ctx.lineTo(x,y+28); ctx.stroke();
        ctx.fillStyle='#241d30'; ctx.strokeStyle='#ff8a3d'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='rgba(255,220,150,0.9)';               // 하이라이트
        ctx.beginPath(); ctx.arc(x-3,y-3,2.5,0,Math.PI*2); ctx.fill();
      } else if(e.type==='boom'){
        const p=e.t/e.life;
        ctx.globalAlpha=1-p;
        ctx.fillStyle='rgba(255,150,60,'+(1-p)+')';
        ctx.beginPath(); ctx.arc(e.x,e.y,15+p*46,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,90,60,'+(0.85*(1-p))+')';
        ctx.beginPath(); ctx.arc(e.x,e.y,7+p*26,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,235,180,'+(0.9*(1-p))+')';
        ctx.beginPath(); ctx.arc(e.x,e.y,3+p*12,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }

  function drawFloaters(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const f of floaters){
      const a=1-(f.t/f.life);
      ctx.globalAlpha=clamp(a,0,1);
      ctx.font='bold 13px system-ui, sans-serif';
      ctx.fillStyle=f.color;
      ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=3;
      ctx.strokeText(f.text,f.x,f.y); ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;
  }

  // ---------- Loop ----------
  function tick(t){
    if(!running) return;
    const dt = Math.min(0.05, (t-lastT)/1000 || 0);
    lastT=t;
    if(!state.over){
      state.time += dt;                 // 클리어 타임 측정
      updateWaves(dt);
      updateUnits(dt);
      separateUnits();
      // passive income — ramps up with waves, keeps stacking even while idle
      const income = 6 + state.wave*1.3;
      state.gold += income*dt;
      // 적 대포: 5초마다 기지 포격
      state.siegeTimer -= dt;
      if(state.siegeTimer<=0){ fireCannon(); state.siegeTimer=5; }
      // cooldowns
      for(const k in cds){ if(cds[k]>0) cds[k]=Math.max(0,cds[k]-dt); }
      // 승리 조건: 목표 점수 달성
      if(state.score >= state.goal) win();
    }
    updateFX(dt);
    draw();
    syncUI();
    animId=requestAnimationFrame(tick);
  }

  // ---------- UI sync ----------
  let cds={};
  const el = id=>document.getElementById(id);
  function syncUI(){
    el('uiGold').textContent = Math.floor(state.gold);
    el('uiWave').textContent = state.wave;
    el('uiTime').textContent = fmtTime(state.time);
    const gfrac = clamp(state.score/state.goal,0,1);
    el('uiGoal').style.width = (gfrac*100)+'%';
    el('uiGoalText').textContent = state.score+' / '+state.goal;
    const frac = clamp(state.baseHp/state.baseMax,0,1);
    el('uiBaseHp').style.width = (frac*100)+'%';
    el('uiBaseHp').style.background = frac>0.5
      ? 'linear-gradient(90deg,#57e39b,#2fd07a)'
      : frac>0.25 ? 'linear-gradient(90deg,#ffd34e,#f0a020)'
      : 'linear-gradient(90deg,#ff6a6a,#e83b3b)';
    el('uiBaseHpText').textContent = Math.max(0,Math.ceil(state.baseHp))+' / '+state.baseMax;
    // button states
    for(const key in CAT_TYPES){ updateBtn('cat_'+key, CAT_TYPES[key].cost); }
    for(const key in ITEMS){ updateBtn('item_'+key, ITEMS[key].cost); }
  }
  function updateBtn(id, cost){
    const btn=document.querySelector('[data-id="'+id+'"]'); if(!btn) return;
    const cd=cds[id]||0;
    const total = id.startsWith('cat_') ? CAT_TYPES[id.slice(4)].cd : ITEMS[id.slice(5)].cd;
    const cooling = cd>0 && !state.over;
    const ready = !cooling && state.gold>=cost && !state.over;
    btn.classList.toggle('cooling', cooling);
    btn.classList.toggle('ready', ready);       // 사용 가능하면 테두리 반짝임
    // gold/게임오버로 인한 흐림은 쿨타임 중이 아닐 때만 (쿨타임 숫자는 또렷하게)
    btn.classList.toggle('disabled', (state.gold<cost || state.over) && !cooling);
    if(cooling){
      btn.querySelector('.cd-bar').style.transform='scaleX('+(1-cd/total)+')';
      btn.querySelector('.cd-text').textContent = cd.toFixed(1);
    }
  }

  // ---------- Build dock buttons ----------
  // render a character's head to a small canvas so the button icon == in-game art
  function makeIcon(key){
    const s=38, dpr=Math.min(window.devicePixelRatio||1,2);
    const c=document.createElement('canvas');
    c.className='g-icon'; c.width=s*dpr; c.height=s*dpr;
    c.style.width=s+'px'; c.style.height=s+'px';
    const ic=c.getContext('2d'); ic.setTransform(dpr,0,0,dpr,0,0);
    const saved=ctx; ctx=ic;               // temporarily retarget the draw fns
    ctx.save(); ctx.translate(s/2, s*0.62); (CAT_DRAW[key]||drawDog)(12); ctx.restore();
    ctx=saved;
    return c;
  }

  function buildDock(){
    const catRow=el('catRow'), itemRow=el('itemRow');
    catRow.innerHTML=''; itemRow.innerHTML='';
    for(const key in CAT_TYPES){
      const t=CAT_TYPES[key];
      const b=document.createElement('div');
      b.className='gbtn'; b.dataset.id='cat_'+key;
      b.innerHTML=`<span class="g-name">${t.name}</span>
        <span class="g-role">${t.role}</span>
        <span class="g-cost">💰${t.cost}</span>
        <span class="cd"><span class="cd-text"></span><span class="cd-bar"></span></span>`;
      b.insertBefore(makeIcon(key), b.firstChild);
      b.addEventListener('click', ()=>trySpawnCat(key));
      catRow.appendChild(b);
    }
    for(const key in ITEMS){
      const t=ITEMS[key];
      const b=document.createElement('div');
      b.className='gbtn'; b.dataset.id='item_'+key;
      b.innerHTML=`<span class="g-emoji">${t.emoji}</span>
        <span class="g-name">${t.name}</span>
        <span class="g-cost">💰${t.cost}</span>
        <span class="cd"><span class="cd-text"></span><span class="cd-bar"></span></span>`;
      b.addEventListener('click', ()=>useItem(key));
      itemRow.appendChild(b);
    }
  }

  // ---------- Banners / feedback ----------
  let bannerTimer=null;
  function banner(txt){
    const b=el('waveBanner'); b.textContent=txt; b.classList.add('show');
    clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>b.classList.remove('show'),1800);
  }
  function flashDock(){ pulse('#ff4d4d'); }
  function pulse(color){
    const s=el('shell');
    s.animate([{boxShadow:'0 0 0 0 '+color},{boxShadow:'0 0 0 0 transparent'}],{duration:400});
  }

  // ---------- Time format ----------
  function fmtTime(t){
    const m=Math.floor(t/60), s=t%60;
    return m>0 ? m+':'+s.toFixed(1).padStart(4,'0') : s.toFixed(1)+'s';
  }

  // ---------- Best time (localStorage, with in-memory fallback) ----------
  const BEST_KEY='anipang1000_best';
  let memBest=null;
  function getBest(){
    try{ const v=parseFloat(localStorage.getItem(BEST_KEY)); if(!isNaN(v)) return v; }catch(e){}
    return memBest;
  }
  function saveBest(t){ memBest=t; try{ localStorage.setItem(BEST_KEY, String(t)); }catch(e){} }
  function refreshBest(){
    const b=getBest();
    el('bestLine').textContent = b==null ? '아직 기록 없음' : '🏆 최고 기록 '+fmtTime(b);
  }

  // ---------- Hero art: draw our four friends on the overlay ----------
  function drawHero(){
    const c=el('heroArt'); if(!c) return;
    const keys=['tank','archer','dps','heal'];
    const w=280, h=86, dpr=Math.min(window.devicePixelRatio||1,2);
    c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px';
    const hc=c.getContext('2d'); hc.setTransform(dpr,0,0,dpr,0,0);
    const saved=ctx; ctx=hc;
    const gap=w/keys.length;
    keys.forEach((k,i)=>{
      ctx.save(); ctx.translate(gap*(i+0.5), h*0.6);
      // little shadow
      ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath();
      ctx.ellipse(0,24,20,7,0,0,Math.PI*2); ctx.fill();
      CAT_DRAW[k](21);
      ctx.restore();
    });
    ctx=saved;
  }

  // ---------- Win / Game over ----------
  function win(){
    if(state.over) return;
    state.over=true; state.won=true;
    banner('🎉 1000점 달성!');
    const prev=getBest();
    const isNew = prev==null || state.time<prev;
    if(isNew) saveBest(state.time);
    refreshBest();
    const ov=el('overlay'); ov.classList.remove('hide');
    el('overlayTitle').textContent='🎉 스테이지 클리어!';
    const record = isNew
      ? `🎉 <b style="color:var(--cat)">신기록 달성!</b>`
      : `🏆 최고 기록 <b>${fmtTime(prev)}</b>`;
    el('overlaySub').innerHTML=`목표 <b>1000점</b> 달성!<br>클리어 타임 <b style="color:var(--gold);font-size:24px">${fmtTime(state.time)}</b><br>${record}`;
    el('startBtn').textContent='다시 도전 (타임 어택)';
  }
  function gameOver(){
    if(state.over) return;
    state.over=true;
    refreshBest();
    const ov=el('overlay'); ov.classList.remove('hide');
    el('overlayTitle').textContent='기지 함락… 😿';
    el('overlaySub').innerHTML=`${state.score}점에서 기지가 무너졌습니다.<br>목표 <b>1000점</b>까지 <b style="color:var(--gold)">${Math.max(0,state.goal-state.score)}점</b> 남았어요. 다시 도전!`;
    el('startBtn').textContent='다시 도전';
  }

  // ---------- Start ----------
  function startGame(){
    reset(); buildDock();
    el('overlay').classList.add('hide');
    running=true; lastT=performance.now();
    state.waveBreak=1.2;
    cancelAnimationFrame(animId);
    animId=requestAnimationFrame(tick);
  }

  el('startBtn').addEventListener('click', startGame);

  // init
  resize(); reset(); buildDock(); syncUI(); draw(); drawHero(); refreshBest();
  window.addEventListener('resize', ()=>{ resize(); draw(); drawHero(); });

})();
</script>
